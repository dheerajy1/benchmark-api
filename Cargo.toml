[package]
name = "benchmark-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
walkdir = "2.5.0"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
